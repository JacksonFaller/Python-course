[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "python-for-csharp-developers"
version = "0.1.0"
description = "Hands-on Python course for experienced C# developers"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic",
    "sqlalchemy",
    "uvicorn",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["exercises*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
